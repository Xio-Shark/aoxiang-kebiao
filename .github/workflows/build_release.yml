name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd schedule-app/mobile_app
          flutter pub get

      - name: Build Android APK
        run: |
          cd schedule-app/mobile_app
          chmod +x android/gradlew
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Asset
        run: |
          TAG_OR_REF="${GITHUB_REF_NAME:-latest}"
          cp schedule-app/mobile_app/build/app/outputs/flutter-apk/app-release.apk "./aoxiang-kebiao-${TAG_OR_REF}.apk"
          cp schedule-app/mobile_app/build/app/outputs/flutter-apk/app-release.apk ./aoxiang-kebiao.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoxiang-kebiao-android-apk
          path: |
            aoxiang-kebiao-*.apk
            aoxiang-kebiao.apk
          if-no-files-found: error

      - name: Publish Android APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aoxiang-kebiao-*.apk
            aoxiang-kebiao.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
