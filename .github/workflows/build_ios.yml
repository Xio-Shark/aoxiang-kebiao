name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd schedule-app/mobile_app
          flutter pub get

      - name: Build iOS app (no codesign)
        run: |
          cd schedule-app/mobile_app
          flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          cd schedule-app/mobile_app/build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r aoxiang-kebiao-ios-unsigned.ipa Payload
          mv aoxiang-kebiao-ios-unsigned.ipa ../../../../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoxiang-kebiao-ios-ipa
          path: aoxiang-kebiao-ios-unsigned.ipa
          if-no-files-found: error

      - name: Upload IPA to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aoxiang-kebiao-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
